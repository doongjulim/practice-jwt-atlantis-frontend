<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Products Page - Dashboard Template</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600">
  <link rel="stylesheet" href="static/jquery-ui-datepicker/jquery-ui.min.css" type="text/css" />
  <!-- https://fonts.google.com/specimen/Open+Sans -->
  <link rel="stylesheet" href="static/css/fontawesome.min.css">
  <!-- https://fontawesome.com/ -->
  <link rel="stylesheet" href="static/css/bootstrap.min.css">

  <link rel="stylesheet" href="static/css/tooplate.css">

<body id="reportsPage" class="bg02">

<div class="" id="home">
  <div class="container">
    <div data-include-path="navbar.html"></div>
    <div class="tm-main-content h-100">
      <!-- Coffee Menu -->
      <section class="tm-section">
        <h2 class="tm-section-header">Coffee Menu</h2>
        <div class="tm-responsive-table">
          <input type="datepicker" id="datepicker" readonly/>
          <a href="add-schedule.html" class="btn btn-small btn-primary">스케쥴 등록</a>

          <table id="schedule-table">
            <tr class="tm-tr-header">
              <th>이름</th>
              <th>월</th>
              <th>화</th>
              <th>수</th>
              <th>목</th>
              <th>금</th>
              <th>토</th>
              <th>일</th>
            </tr>
            <tr>
              <td colspan="8">등록된 스케쥴 없음</td>
            </tr>
          </table>
        </div>
      </section>
    </div>
    <footer class="row tm-mt-small">
      <div class="col-12 font-weight-light">
        <p class="d-inline-block tm-bg-black text-white py-2 px-4">
          Copyright &copy; 2018 Admin Dashboard . Created by
          <a rel="nofollow" href="https://www.tooplate.com" class="text-white tm-footer-link">Tooplate</a>
        </p>
      </div>
    </footer>
  </div>
</div>

<script src="static/js/jquery-3.3.1.min.js"></script>
<script src="static/jquery-ui-datepicker/jquery-ui.min.js"></script>
<script src="static/js/bootstrap.min.js"></script>

<script src="static/js/include.js"></script>

<script>
  $(function () {
    $('.tm-product-name').on('click', function () {
      window.location.href = "edit-product.html";
    });
  })
</script>
</body>

</html>
