<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Add Product - Dashboard Admin Template</title>
  <!--

  Template 2108 Dashboard

  http://www.tooplate.com/view/2108-dashboard

  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600">
  <!-- https://fonts.google.com/specimen/Open+Sans -->
  <link rel="stylesheet" href="static/css/fontawesome.min.css">
  <!-- https://fontawesome.com/ -->
  <link rel="stylesheet" href="static/jquery-ui-datepicker/jquery-ui.min.css" type="text/css" />
  <!-- http://api.jqueryui.com/datepicker/ -->
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <!-- https://getbootstrap.com/ -->
  <link rel="stylesheet" href="static/css/tooplate.css">
</head>

<body class="bg02">
<div class="container">
  <div data-include-path="navbar.html"></div>
  <!-- row -->
  <div class="row tm-mt-big">
    <div class="col-xl-8 col-lg-10 col-md-12 col-sm-12">
      <div class="bg-white tm-block">
        <div class="row">
          <div class="col-12">
            <h2 class="tm-block-title d-inline-block">스케줄 등록</h2>
          </div>
          <div class="col-12">
            <p class="text-black-50 p-sm-2 d-inline-block"> * 출근 코드를 골라야지만 퇴근 코드가 등록됩니다. </p>
            <p class="text-black-50 p-sm-2 d-inline-block"> * 등록시 기존 스케쥴 (시작일로부터 일주일)은 삭제됩니다. </p>
          </div>
        </div>
        <div class="row mt-4 tm-edit-product-row">
          <div class="col-xl-7 col-lg-7 col-md-12">
            <form action="" class="tm-edit-product-form">
              <div class="input-group mb-3">
                <label for="userSelector" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">캐스트</label>
                <select name="userId" id="userSelector" class="custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected>선택</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="datepicker" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">시작일</label>
                <input type="datepicker" name="startDay" id="datepicker" class="form-control validate col-xl-9 col-lg-8 col-md-8 col-sm-7" readonly/>
              </div>
              <div class="input-group mb-3">
                <label for="endDay" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">종료일</label>
                <p class="text-xl-center" id="endDay"></p>
              </div>
              <div class="input-group mb-3">
                <label for="mondayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">월요일</label>
                <select name="mondayWorkCode" id="mondayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="tuesDayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">화요일</label>
                <select name="tuesDayWorkCode" id="tuesDayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="wednesdayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">수요일</label>
                <select name="wednesdayWorkCode" id="wednesdayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="thursdayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">목요일</label>
                <select name="thursdayWorkCode" id="thursdayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="fridayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">금요일</label>
                <select name="fridayWorkCode" id="fridayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="saturdayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">토요일</label>
                <select name="saturdayWorkCode" id="saturdayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <label for="sundayWorkCode" class="col-xl-4 col-lg-4 col-md-4 col-sm-5 col-form-label">일요일</label>
                <select name="sundayWorkCode" id="sundayWorkCode" class="workCodeSelector custom-select col-xl-9 col-lg-8 col-md-8 col-sm-7">
                  <option selected value="">휴무</option>
                </select>
              </div>
              <div class="input-group mb-3">
                <div class="ml-auto col-xl-8 col-lg-8 col-md-8 col-sm-7 pl-0">
                  <button type="button" id="schedule-btn" class="btn btn-primary">Add</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="row tm-mt-big">
    <div class="col-12 font-weight-light">
      <p class="d-inline-block tm-bg-black text-white py-2 px-4">
        Copyright &copy; 2018 Admin Dashboard . Created by
        <a rel="nofollow" href="https://www.tooplate.com" class="text-white tm-footer-link">Tooplate</a>
      </p>
    </div>
  </footer>
</div>

<script src="static/js/jquery-3.3.1.min.js"></script>
<!-- https://jquery.com/download/ -->
<script src="static/jquery-ui-datepicker/jquery-ui.min.js"></script>
<!-- https://jqueryui.com/download/ -->
<script src="static/js/bootstrap.min.js"></script>
<!-- https://getbootstrap.com/ -->
<script src="static/js/add-schedule.js"></script>
<script src="static/js/include.js"></script>

<script>
  $(function () {
    $('#expire_date').datepicker();
  });
</script>
</body>

</html>
